name: docker-build

on:
  push:
    branches:
      - main
    tags:
      - "go-tari-tools-v*"
  workflow_call:
    inputs:
      push_image:
        description: "Whether to actually push the built image (true when called after a real release)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    name: Docker build (payoutDaemon)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only push (and tag `latest`) on version tags, or when invoked via
      # workflow_call from release-please.yml after a real release. Plain
      # pushes to main build and validate the image but never publish it.
      #
      # Note: `release-please-action`'s own tag/release push is performed
      # using the default GITHUB_TOKEN, which GitHub Actions deliberately
      # never allows to trigger downstream `on: push` workflow runs (this is
      # anti-recursion behavior, not a bug) — so the `ref_type == 'tag'`
      # branch below is a fallback for manually-pushed tags only; the real
      # path in practice is the `workflow_call` branch, invoked directly by
      # release-please.yml in the same run. Dereferencing `inputs.push_image`
      # on a non-workflow_call trigger evaluates to an empty string per
      # GitHub's context rules, which is falsy here, so this is safe to
      # reference unconditionally.
      - name: Determine whether to push
        id: push-gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_call" && "${{ inputs.push_image }}" == "true" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push-gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/snipa22/go-tari-tools-payoutdaemon
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.push-gate.outputs.push == 'true' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/payoutDaemon/Dockerfile
          push: ${{ steps.push-gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=payoutDaemon
          cache-to: type=gha,mode=max,scope=payoutDaemon
