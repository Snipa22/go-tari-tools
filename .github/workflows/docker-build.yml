name: docker-build

on:
  push:
    branches:
      - main
    tags:
      - "go-tari-tools-v*"
  workflow_call:
    inputs:
      push_image:
        description: "Whether to actually push the built image (true when called after a real release)"
        type: boolean
        default: false
      tag_name:
        description: "release-please's tag_name output (e.g. go-tari-tools-v0.2.0), used to stamp a version tag on the pushed image when invoked after a real release"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docker:
    name: Docker build (payoutDaemon)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only push (and tag `latest`) on version tags, or when invoked via
      # workflow_call from release-please.yml after a real release. Plain
      # pushes to main build and validate the image but never publish it.
      #
      # Note: `release-please-action`'s own tag/release push is performed
      # using the default GITHUB_TOKEN, which GitHub Actions deliberately
      # never allows to trigger downstream `on: push` workflow runs (this is
      # anti-recursion behavior, not a bug) — so the `ref_type == 'tag'`
      # branch below is a fallback for manually-pushed tags only; the real
      # path in practice is the `workflow_call` branch, invoked directly by
      # release-please.yml in the same run.
      #
      # IMPORTANT GOTCHA (confirmed from a real fired job log, not a guess):
      # `github.event_name` does NOT become `"workflow_call"` when this
      # workflow is invoked via `uses: ./.github/workflows/docker-build.yml`.
      # It stays as whatever the top-level triggering event was for the
      # *caller* (`release-please.yml` is itself triggered by `on: push`, so
      # `github.event_name` here resolves to `"push"`, never
      # `"workflow_call"`). A prior version of this gate checked
      # `github.event_name == 'workflow_call' && inputs.push_image == 'true'`
      # and the first half was always false, so the image built successfully
      # but was silently never pushed. `inputs.push_image` alone is the
      # correct and sufficient check: it's only ever `"true"` when
      # release-please.yml's `docker-build-release` job explicitly set it
      # that way, and on any other trigger where the input doesn't apply it
      # evaluates to an empty string, which never equals `"true"` here
      # either — so no `event_name` check is needed alongside it.
      - name: Determine whether to push
        id: push-gate
        run: |
          if [[ "${{ inputs.push_image }}" == "true" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push-gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/snipa22/go-tari-tools-payoutdaemon
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.push-gate.outputs.push == 'true' }}
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/payoutDaemon/Dockerfile
          push: ${{ steps.push-gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=payoutDaemon
          cache-to: type=gha,mode=max,scope=payoutDaemon
